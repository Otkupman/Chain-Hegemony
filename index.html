<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsQAAA7EAZUrDhsAAABlSURBVFhHYzQyMvrPMICACURsleICYxgglc+UthKMYYAUPtgBAwkGRxQMJBhNA6NpYDQNjKaB0TQwmgbADvgzyx6MYYBU/v5Jd8EYBkjhj6aB0TQwmgZG08BoGhhNAyM9DTAwAABgVcwVAjRCngAAAABJRU5ErkJggg==">
  <title>Chain Hegemony 2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0a0a14;
      background: radial-gradient(circle at center, #1a1a2e 0%, #05050a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 10px;
      color: #fff;
    }
    .game-container {
      background: rgba(20, 20, 35, 0.6);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 100%;
      max-width: 600px;
    }
    canvas {
      background: #0d0d16;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9), inset 0 0 15px rgba(255,255,255,0.02);
      display: block;
      cursor: crosshair;
      width: 100%;
      height: auto;
      max-width: 512px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .player-count {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #aaa;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .player-count select {
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: #1e1e30;
      color: #00ffcc;
      font-size: 13px;
      font-weight: bold;
      outline: none;
      cursor: pointer;
    }
    .players-setup {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }
    .player-card {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #ddd;
      font-size: 12px;
      transition: all 0.3s;
    }
    .player-card:hover {
      background: rgba(255, 255, 255, 0.05);
    }
    .player-card .name {
      font-weight: bold;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .player-card .options {
      display: flex;
      gap: 8px;
    }
    .player-card label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .player-card select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: #2a2a4a;
      color: white;
      font-size: 11px;
      outline: none;
    }
    .btn {
      background: linear-gradient(45deg, #ff0055, #ff0099);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }
    .btn:hover {
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(1px) scale(0.98);
    }
    .status {
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 16px;
      border-radius: 20px;
      text-align: center;
      width: 100%;
      box-shadow: inset 0 0 10px rgba(255,255,255,0.05);
    }
    .extra-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      color: #aaa;
      font-size: 13px;
    }
    .extra-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .extra-controls input[type="range"] {
      width: 80px;
      accent-color: #00ffcc;
    }
    .extra-controls input[type="checkbox"] {
      accent-color: #00ffcc;
      width: 16px;
      height: 16px;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #444;
      transition: .3s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00ffcc;
      box-shadow: 0 0 8px #00ffcc;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    .title-section {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 12px 16px;
      color: #999;
      font-size: 12px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      line-height: 1.5;
    }
    .title-section .main-title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #fff;
      text-shadow: 0 0 15px rgba(255,0,85,0.7), 0 0 30px rgba(255,0,85,0.4);
      margin-bottom: 2px;
    }
    .title-section .sub-title {
      font-size: 13px;
      letter-spacing: 2px;
      color: #00ffcc;
      text-shadow: 0 0 10px rgba(0,255,204,0.5);
    }
    .copyright {
      width: 100%;
      text-align: center;
      color: #555;
      font-size: 11px;
      letter-spacing: 1px;
    }
    @media (max-width: 520px) {
      .game-container {
        padding: 10px;
        gap: 10px;
      }
      .top-controls {
        gap: 8px;
      }
      .player-card {
        padding: 8px 10px;
        font-size: 11px;
      }
      .player-card .name {
        font-size: 13px;
      }
      .btn {
        padding: 8px 16px;
        font-size: 13px;
      }
      .status {
        font-size: 13px;
        padding: 6px 12px;
      }
      .extra-controls {
        gap: 10px;
        font-size: 12px;
      }
      .extra-controls input[type="range"] {
        width: 60px;
      }
      .title-section .main-title {
        font-size: 20px;
      }
      .title-section .sub-title {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
<div class="game-container">
  <canvas id="gameCanvas" width="512" height="512"></canvas>

  <div class="controls">
    <div class="top-controls">
      <label style="display: flex; align-items: center; gap: 4px; color: #aaa; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">
        <span style="font-size: 11px;">Own</span>
        <label class="toggle-switch">
          <input type="checkbox" id="modeToggle">
          <span class="slider"></span>
        </label>
        <span style="font-size: 11px;">Any</span>
      </label>
      <div class="player-count">
        <span>Players</span>
        <select id="numPlayers">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
        </select>
      </div>
      <button class="btn" id="newGameBtn">Start Protocol</button>
    </div>
    <div id="playersSetup" class="players-setup"></div>
    <div class="extra-controls">
      <label>
        Speed <input type="range" id="speedSlider" min="1" max="30" value="15">
        <span id="speedValue" style="color: #00ffcc; font-weight: bold;">15</span>
      </label>
      <label>
        SFX <input type="checkbox" id="soundCheckbox" checked>
      </label>
    </div>
  </div>

  <div id="status" class="status">SYSTEM IDLE: CONFIGURE MATCH</div>

  <div class="title-section">
    <div class="main-title">Chain Hegemony 2</div>
    <div class="sub-title">Optical Edition</div>
  </div>

  <div class="copyright">© ODVk</div>
</div>

<script>
  (function() {
    const ROWS = 8, COLS = 8;
    const CELL_SIZE = 64;
    const COLORS = ["#ff2a2a", "#00d4ff", "#00ff66", "#ffcc00"];
    
    let speed = 15;
    let soundEnabled = true;
    let placementMode = 'own';

    function getExplosionDelay() { return Math.round(500 / speed); }
    function getAiThinkDelay() { return Math.round(250 / speed); }
    function getAiHighlightDelay() { return Math.round(400 / speed); }

    function playBeep(freq, duration, type = 'sine') {
      if (!soundEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + duration / 1000);
      } catch (e) { }
    }

    function soundMove() { playBeep(800, 80, 'sine'); }
    function soundExplosion() { playBeep(150, 200, 'square'); }
    function soundWin() { playBeep(1200, 400, 'triangle'); }

    class Board {
      constructor(numPlayers) {
        this.numPlayers = numPlayers;
        this.grid = Array.from({ length: ROWS }, () =>
          Array.from({ length: COLS }, () => ({ count: 0, owner: null }))
        );
        this.initCorners();
      }

      initCorners() {
        const corners = {
          2: { 0: [0,0], 1: [7,7] },
          3: { 0: [0,0], 1: [0,7], 2: [7,0] },
          4: { 0: [0,0], 1: [0,7], 2: [7,0], 3: [7,7] }
        };
        for (let p = 0; p < this.numPlayers; p++) {
          const [r, c] = corners[this.numPlayers][p];
          this.grid[r][c].count = 3;
          this.grid[r][c].owner = p;
        }
      }

      clone() {
        const b = new Board(this.numPlayers);
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            b.grid[r][c] = { count: this.grid[r][c].count, owner: this.grid[r][c].owner };
          }
        }
        return b;
      }

      legalMoves(player, mode) {
        const moves = [];
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (mode === 'anywhere') {
              if (this.grid[r][c].owner === player || this.grid[r][c].owner === null) moves.push([r, c]);
            } else {
              if (this.grid[r][c].owner === player) moves.push([r, c]);
            }
          }
        }
        return moves;
      }

      activePlayers() {
        const owners = new Set();
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            const cell = this.grid[r][c];
            if (cell.count > 0 && cell.owner !== null) owners.add(cell.owner);
          }
        }
        return [...owners].sort((a,b) => a - b);
      }

      winner() {
        const active = this.activePlayers();
        if (active.length === 1) return active[0];
        if (active.length === 0) return -1;
        return null;
      }

      addPiece(player, r, c, mode) {
        if (mode === 'anywhere') {
          if (this.grid[r][c].owner !== player && this.grid[r][c].owner !== null) return [];
        } else {
          if (this.grid[r][c].owner !== player) return [];
        }
        
        this.grid[r][c].count++;
        this.grid[r][c].owner = player;
        const states = [];
        
        while (true) {
          let toExplode = null;
          for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
              if (this.grid[i][j].count >= 4) {
                toExplode = [i, j];
                break;
              }
            }
            if (toExplode) break;
          }
          if (!toExplode) break;
          
          const [r0, c0] = toExplode;
          const p = this.grid[r0][c0].owner;
          this.grid[r0][c0].count -= 4;
          if (this.grid[r0][c0].count === 0) this.grid[r0][c0].owner = null;
          
          const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
          for (const [dr, dc] of dirs) {
            const nr = r0 + dr, nc = c0 + dc;
            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
              this.grid[nr][nc].count++;
              this.grid[nr][nc].owner = p;
            }
          }
          states.push(this.clone());
        }
        if (states.length === 0) states.push(this.clone());
        return states;
      }
    }

    function evaluate(board, player, activePlayers) {
      let myCount = 0;
      let otherCounts = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board.grid[r][c];
          if (cell.owner === player) myCount += cell.count;
          else if (cell.owner !== null && activePlayers.includes(cell.owner)) {
            const idx = otherCounts.findIndex(x => x.player === cell.owner);
            if (idx === -1) otherCounts.push({ player: cell.owner, count: cell.count });
            else otherCounts[idx].count += cell.count;
          }
        }
      }
      const maxOther = otherCounts.length > 0 ? Math.max(...otherCounts.map(o => o.count)) : 0;
      return myCount - maxOther;
    }

    function aiMove(board, player, difficulty) {
      const mode = placementMode;
      const legal = board.legalMoves(player, mode);
      if (legal.length === 0) return null;
      if (difficulty === 'easy') return legal[Math.floor(Math.random() * legal.length)];
      
      const active = board.activePlayers();
      if (difficulty === 'medium') {
        let bestScore = -Infinity, bestMoves = [];
        for (const move of legal) {
          const sim = board.clone();
          sim.addPiece(player, move[0], move[1], mode);
          const w = sim.winner();
          let score = (w === player) ? 10000 : (w !== null && w !== -1) ? -10000 : (w === -1) ? -5000 : evaluate(sim, player, active);
          if (score > bestScore) { bestScore = score; bestMoves = [move]; } 
          else if (score === bestScore) { bestMoves.push(move); }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
      }
      
      if (difficulty === 'hard') {
        const opponents = active.filter(p => p !== player);
        let targetOpponent = null, maxOppCount = -1;
        for (const opp of opponents) {
          let cnt = 0;
          for (let r=0; r<ROWS; r++) for (let c=0; c<COLS; c++) if (board.grid[r][c].owner === opp) cnt += board.grid[r][c].count;
          if (cnt > maxOppCount) { maxOppCount = cnt; targetOpponent = opp; }
        }
        if (targetOpponent === null) return legal[0];
        
        let bestScore = -Infinity, bestMoves = [];
        for (const move of legal) {
          const simAfterMyMove = board.clone();
          simAfterMyMove.addPiece(player, move[0], move[1], mode);
          const oppLegal = simAfterMyMove.legalMoves(targetOpponent, mode);
          let minScore = Infinity;
          if (oppLegal.length === 0) {
            minScore = evaluate(simAfterMyMove, player, active);
          } else {
            for (const oppMove of oppLegal) {
              const simAfterOpp = simAfterMyMove.clone();
              simAfterOpp.addPiece(targetOpponent, oppMove[0], oppMove[1], mode);
              const score = evaluate(simAfterOpp, player, active);
              if (score < minScore) minScore = score;
            }
          }
          if (minScore > bestScore) { bestScore = minScore; bestMoves = [move]; } 
          else if (minScore === bestScore) { bestMoves.push(move); }
        }
        return bestMoves[Math.floor(Math.random() * bestMoves.length)];
      }
      return legal[0];
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');
    const numPlayersSelect = document.getElementById('numPlayers');
    const playersSetupDiv = document.getElementById('playersSetup');
    const newGameBtn = document.getElementById('newGameBtn');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const soundCheckbox = document.getElementById('soundCheckbox');
    const modeToggle = document.getElementById('modeToggle');

    let board = null;
    let players = [];
    let currentPlayer = 0;
    let gameOver = false;
    let animating = false;
    let aiHighlight = null;
    let animationTimer = null;
    let globalTime = 0;
    
    requestAnimationFrame(renderLoop);

    speedSlider.addEventListener('input', () => {
      speed = parseInt(speedSlider.value);
      speedValue.textContent = speed;
    });
    soundCheckbox.addEventListener('change', () => { soundEnabled = soundCheckbox.checked; });
    modeToggle.addEventListener('change', () => {
      placementMode = modeToggle.checked ? 'anywhere' : 'own';
    });

    function renderPlayersSetup() {
      const num = parseInt(numPlayersSelect.value);
      playersSetupDiv.innerHTML = '';
      
      for (let i = 0; i < num; i++) {
        const card = document.createElement('div');
        card.className = 'player-card';
        card.style.borderTop = `3px solid ${COLORS[i]}`;
        card.innerHTML = `
          <div class="name" style="color:${COLORS[i]}; text-shadow: 0 0 8px ${COLORS[i]}">Player ${i+1}</div>
          <div class="options">
            <label><input type="radio" name="player${i}" value="human" ${i === 0 ? 'checked' : ''}> Human</label>
            <label><input type="radio" name="player${i}" value="ai" ${i > 0 ? 'checked' : ''}> AI</label>
          </div>
          <select id="diff${i}" class="diff-select">
            <option value="easy" selected>Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        `;
        playersSetupDiv.appendChild(card);
      }
      
      for (let i = 0; i < num; i++) {
        const humanRadio = document.querySelector(`input[name="player${i}"][value="human"]`);
        const aiRadio = document.querySelector(`input[name="player${i}"][value="ai"]`);
        const diffSelect = document.getElementById(`diff${i}`);
        const updateVisibility = () => diffSelect.style.display = humanRadio.checked ? 'none' : 'inline-block';
        humanRadio.addEventListener('change', updateVisibility);
        aiRadio.addEventListener('change', updateVisibility);
        updateVisibility();
      }
    }

    function collectPlayers() {
      const num = parseInt(numPlayersSelect.value);
      const arr = [];
      for (let i = 0; i < num; i++) {
        const typeRadio = document.querySelector(`input[name="player${i}"]:checked`);
        const diffSelect = document.getElementById(`diff${i}`);
        const type = typeRadio ? typeRadio.value : 'ai';
        const difficulty = (type === 'ai') ? diffSelect.value : 'easy';
        arr.push({ type, difficulty });
      }
      return arr;
    }

    function renderLoop() {
      globalTime += 0.05;
      
      ctx.fillStyle = '#0a0a10';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      if (!board) {
        ctx.fillStyle = '#444';
        ctx.font = '16px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('WAITING FOR PROTOCOL INITIATION...', canvas.width/2, canvas.height/2);
        requestAnimationFrame(renderLoop);
        return;
      }

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath(); ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(canvas.width, i * CELL_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, canvas.height); ctx.stroke();
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = board.grid[r][c];
          if (cell.count === 0) continue;

          const cx = c * CELL_SIZE + CELL_SIZE / 2;
          const cy = r * CELL_SIZE + CELL_SIZE / 2;
          const color = COLORS[cell.owner];
          
          const isCritical = cell.count === 3;
          const pulse = isCritical ? Math.sin(globalTime * 2) * 3 : 0;
          const baseRadius = 6;
          
          ctx.shadowBlur = 15 + (isCritical ? pulse * 2 : 0);
          ctx.shadowColor = color;
          ctx.fillStyle = color;

          const drawOrb = (ox, oy) => {
            ctx.beginPath();
            ctx.arc(ox, oy, baseRadius + (isCritical ? pulse * 0.5 : 0), 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(ox, oy, baseRadius * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = color;
            ctx.shadowBlur = 15 + (isCritical ? pulse * 2 : 0);
          };

          if (cell.count === 1) {
            drawOrb(cx, cy);
          } else if (cell.count === 2) {
            drawOrb(cx - 10, cy);
            drawOrb(cx + 10, cy);
          } else if (cell.count === 3) {
            drawOrb(cx, cy - 10);
            drawOrb(cx - 10, cy + 8);
            drawOrb(cx + 10, cy + 8);
          }
          ctx.shadowBlur = 0;
        }
      }

      if (!gameOver && currentPlayer !== null && board.activePlayers().includes(currentPlayer)) {
        ctx.strokeStyle = COLORS[currentPlayer];
        ctx.shadowColor = COLORS[currentPlayer];
        ctx.shadowBlur = 20;
        ctx.lineWidth = 2;
        ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
        ctx.shadowBlur = 0;
      }

      if (aiHighlight) {
        const [r, c] = aiHighlight;
        ctx.strokeStyle = COLORS[currentPlayer];
        ctx.shadowColor = COLORS[currentPlayer];
        ctx.shadowBlur = 10;
        ctx.lineWidth = 2;
        ctx.strokeRect(c * CELL_SIZE + 2, r * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
        ctx.shadowBlur = 0;
      }

      requestAnimationFrame(renderLoop);
    }

    function setStatus(text, color = '#fff') {
      statusDiv.innerHTML = text;
      statusDiv.style.color = color;
      statusDiv.style.textShadow = `0 0 10px ${color}`;
    }

    function advanceToNextActive() {
      const active = board.activePlayers();
      if (active.length === 0) {
        endGame(-1);
        return false;
      }
      for (let i = 0; i < players.length; i++) {
        currentPlayer = (currentPlayer + 1) % players.length;
        if (active.includes(currentPlayer)) break;
      }
      return true;
    }

    function endGame(winner) {
      if (gameOver) return;
      gameOver = true;
      if (winner === -1) {
        setStatus('ANOMALY: ALL ENERGY DISSIPATED (DRAW)', '#ff00ff');
      } else {
        soundWin();
        setStatus(`VICTORY: PLAYER ${winner+1} DOMINATES`, COLORS[winner]);
      }
    }

    function runTurn() {
      if (gameOver || animating) return;
      const active = board.activePlayers();
      if (!active.includes(currentPlayer)) {
        if (!advanceToNextActive()) return;
        runTurn();
        return;
      }
      const p = players[currentPlayer];
      if (p.type === 'human') {
        setStatus(`PLAYER ${currentPlayer+1} <span style="font-size:12px;color:#aaa;">[HUMAN]</span> : AWAITING INPUT`, COLORS[currentPlayer]);
      } else {
        setStatus(`PLAYER ${currentPlayer+1} <span style="font-size:12px;color:#aaa;">[AI COMPUTING...]</span>`, COLORS[currentPlayer]);
        setTimeout(() => aiTurn(), getAiThinkDelay());
      }
    }

    function aiTurn() {
      if (gameOver || animating) return;
      const move = aiMove(board, currentPlayer, players[currentPlayer].difficulty);
      if (!move) {
        if (!advanceToNextActive()) return;
        runTurn();
        return;
      }
      const [r, c] = move;
      aiHighlight = [r, c];
      soundMove();
      setTimeout(() => {
        aiHighlight = null;
        executeMove(r, c);
      }, getAiHighlightDelay());
    }

    function executeMove(r, c) {
      if (animating) return;
      const mode = placementMode;
      const states = board.addPiece(currentPlayer, r, c, mode);
      if (states.length === 0) return;
      board = states[states.length - 1];
      animating = true;
      animateChain(states, 0);
    }

    function animateChain(states, index) {
      if (index < states.length) {
        board = states[index];
        if (index > 0) soundExplosion();
        animationTimer = setTimeout(() => animateChain(states, index + 1), getExplosionDelay());
      } else {
        animating = false;
        const w = board.winner();
        if (w !== null) { endGame(w); return; }
        if (!advanceToNextActive()) return;
        runTurn();
      }
    }

    function handleCanvasClick(e) {
      if (gameOver || animating || players[currentPlayer].type !== 'human') return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const mouseX = (e.clientX - rect.left) * scaleX;
      const mouseY = (e.clientY - rect.top) * scaleY;
      const c = Math.floor(mouseX / CELL_SIZE);
      const r = Math.floor(mouseY / CELL_SIZE);
      
      if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        const mode = placementMode;
        const legal = board.legalMoves(currentPlayer, mode);
        if (legal.some(([rr, cc]) => rr === r && cc === c)) {
          soundMove();
          executeMove(r, c);
        }
      }
    }

    function newGame() {
      if (animating) { clearTimeout(animationTimer); animating = false; }
      players = collectPlayers();
      board = new Board(parseInt(numPlayersSelect.value));
      currentPlayer = 0;
      gameOver = false;
      aiHighlight = null;
      globalTime = 0;
      runTurn();
    }

    numPlayersSelect.addEventListener('change', renderPlayersSetup);
    newGameBtn.addEventListener('click', newGame);
    canvas.addEventListener('click', handleCanvasClick);
    renderPlayersSetup();
    modeToggle.checked = false;
    
  })();
</script>
</body>
</html>
